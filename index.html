<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot IA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            background: #0f0f1a;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            color: white;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .status {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.8);
            margin-top: 5px;
        }

        .status::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }

        .status.offline::before {
            background: #ef4444;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .settings-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .settings-panel {
            display: none;
            padding: 15px 20px;
            background: #1a1a2e;
            border-bottom: 1px solid #2d2d4a;
        }

        .settings-panel.open {
            display: block;
        }

        .settings-panel label {
            display: block;
            color: #94a3b8;
            font-size: 0.8rem;
            margin-bottom: 5px;
        }

        .settings-panel input {
            width: 100%;
            padding: 10px;
            border: 1px solid #2d2d4a;
            border-radius: 8px;
            background: #0f0f1a;
            color: white;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .settings-panel button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #10b981;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .settings-panel button:hover {
            background: #059669;
        }

        .messages {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.bot {
            background: #1e1e2e;
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.bot.error {
            border-left: 3px solid #ef4444;
        }

        .message.user {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .input-area {
            padding: 20px;
            background: #0a0a14;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 25px;
            background: #1e1e2e;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: box-shadow 0.3s;
        }

        .input-area input:focus {
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
        }

        .input-area input::placeholder {
            color: #64748b;
        }

        .input-area button {
            padding: 14px 24px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .input-area button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px -10px rgba(99, 102, 241, 0.5);
        }

        .typing {
            display: none;
            padding: 12px 16px;
            background: #1e1e2e;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
        }

        .typing.active {
            display: flex;
            gap: 4px;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: #64748b;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing span:nth-child(1) { animation-delay: 0s; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>
    <div class="chat-container" style="position: relative;">
        <button class="settings-toggle" onclick="toggleSettings()">⚙️</button>
        
        <div class="chat-header">
            <h1>🤖 Chatbot IA</h1>
            <div class="status" id="status">Conectando...</div>
        </div>
        
        <div class="settings-panel" id="settingsPanel">
            <label>URL do Ollama (ex: http://localhost:11434)</label>
            <input type="text" id="ollamaUrl" placeholder="http://localhost:11434" value="http://localhost:11434">
            
            <label>Modelo</label>
            <input type="text" id="modelName" placeholder="gemma:2b" value="gemma:2b">
            
            <button onclick="connectOllama()">Conectar</button>
        </div>
        
        <div class="messages" id="messages">
            <div class="message bot">
                Olá! 👋 Configure a conexão com Ollama nas configurações (⚙️) para usar IA real, ou use as respostas básicas.
            </div>
            
            <div class="typing" id="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Digite sua mensagem..." autocomplete="off">
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const typing = document.getElementById('typing');
        const statusDiv = document.getElementById('status');
        const settingsPanel = document.getElementById('settingsPanel');
        
        let ollamaUrl = localStorage.getItem('ollamaUrl') || 'http://localhost:11434';
        let modelName = localStorage.getItem('modelName') || 'gemma:2b';
        let isConnected = false;

        document.getElementById('ollamaUrl').value = ollamaUrl;
        document.getElementById('modelName').value = modelName;

        // Fallback responses
        const responses = {
            'oi': 'Olá! Como vai você? 😊',
            'olá': 'Olá! Tudo bem? 👋',
            'oi tudo bem': 'Estou bem, obrigado! E você?',
            'como você está': 'Estou funcionando perfeitamente! 😄',
            'qual seu nome': 'Sou o Chatbot IA! Posso ajudar com diversas coisas.',
            'ajuda': 'Posso ajudar com: informações, perguntas gerais, ou apenas conversar!',
            'tchau': 'Tchau! Foi bom conversar com você! 👋',
            'obrigado': 'De nada! Estou aqui para ajudar! 😊',
            'default': 'Interessante! Me conta mais sobre isso. 🤔'
        };

        function toggleSettings() {
            settingsPanel.classList.toggle('open');
        }

        async function connectOllama() {
            ollamaUrl = document.getElementById('ollamaUrl').value;
            modelName = document.getElementById('modelName').value;
            
            localStorage.setItem('ollamaUrl', ollamaUrl);
            localStorage.setItem('modelName', modelName);
            
            statusDiv.textContent = 'Testando conexão...';
            
            try {
                const response = await fetch(`${ollamaUrl}/api/tags`, {
                    method: 'GET',
                    signal: AbortSignal.timeout(5000)
                });
                
                if (response.ok) {
                    isConnected = true;
                    statusDiv.textContent = '🟢 Conectado • ' + modelName;
                    statusDiv.classList.remove('offline');
                    settingsPanel.classList.remove('open');
                    addMessage('Conectado ao Ollama! Agora posso responder usando IA real. 🤖', false);
                } else {
                    throw new Error('Failed');
                }
            } catch (error) {
                isConnected = false;
                statusDiv.textContent = '🔴 Offline';
                statusDiv.classList.add('offline');
                addMessage('Não consegui conectar ao Ollama. Verifique se está rodando (ollama serve). Usando respostas básicas.', false, true);
            }
        }

        // Auto-connect on load
        connectOllama();

        async function getBotResponse(message) {
            if (isConnected) {
                try {
                    const response = await fetch(`${ollamaUrl}/api/generate`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: modelName,
                            prompt: message,
                            stream: false
                        }),
                        signal: AbortSignal.timeout(60000)
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        return data.response || 'Não consegui gerar uma resposta.';
                    }
                } catch (error) {
                    console.error('Ollama error:', error);
                    addMessage('Erro ao conectar com IA. Usando respostas básicas.', false, true);
                }
            }
            
            // Fallback to simple responses
            const lowerMsg = message.toLowerCase();
            for (const [key, value] of Object.entries(responses)) {
                if (lowerMsg.includes(key)) {
                    return value;
                }
            }
            return responses['default'];
        }

        function addMessage(text, isUser, isError = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}${isError ? ' error' : ''}`;
            messageDiv.textContent = text;
            
            messagesDiv.insertBefore(messageDiv, typing);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showTyping() {
            typing.classList.add('active');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function hideTyping() {
            typing.classList.remove('active');
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, true);
            userInput.value = '';

            showTyping();

            const response = await getBotResponse(message);
            
            hideTyping();
            addMessage(response, false);
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
