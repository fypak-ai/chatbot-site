<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot IA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            background: #0f0f1a;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            color: white;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .status {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.8);
            margin-top: 5px;
        }

        .status::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .messages {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.bot {
            background: #1e1e2e;
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.user {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .input-area {
            padding: 20px;
            background: #0a0a14;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 25px;
            background: #1e1e2e;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: box-shadow 0.3s;
        }

        .input-area input:focus {
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
        }

        .input-area input::placeholder {
            color: #64748b;
        }

        .input-area button {
            padding: 14px 24px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .input-area button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px -10px rgba(99, 102, 241, 0.5);
        }

        .input-area button:active {
            transform: scale(0.95);
        }

        .typing {
            display: none;
            padding: 12px 16px;
            background: #1e1e2e;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
        }

        .typing.active {
            display: flex;
            gap: 4px;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: #64748b;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing span:nth-child(1) { animation-delay: 0s; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
        }

        .message img {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 Chatbot IA</h1>
            <div class="status">Online • Pronto para conversar</div>
        </div>
        
        <div class="messages" id="messages">
            <div class="message bot">
                Olá! 👋 Sou seu assistente virtual. Como posso ajudar você hoje?
            </div>
            
            <div class="typing" id="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Digite sua mensagem..." autocomplete="off">
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const typing = document.getElementById('typing');

        // Respostas do chatbot (pode conectar com IA real)
        const responses = {
            'oi': 'Olá! Como vai você? 😊',
            'olá': 'Olá! Tudo bem? 👋',
            'oi tudo bem': 'Estou bem, obrigado! E você?',
            'como você está': 'Estou funcionando perfeitamente! 😄',
            'qual seu nome': 'Sou o Chatbot IA! Posso ajudar com diversas coisas.',
            'ajuda': 'Posso ajudar com: informações, perguntas gerais, ou apenas conversar!',
            'tchau': 'Tchau! Foi bom conversar com você! 👋',
            'obrigado': 'De nada! Estou aqui para ajudar! 😊',
            'default': 'Interessante! Me conta mais sobre isso. 🤔'
        };

        function getBotResponse(message) {
            const lowerMsg = message.toLowerCase();
            
            for (const [key, value] of Object.entries(responses)) {
                if (lowerMsg.includes(key)) {
                    return value;
                }
            }
            return responses['default'];
        }

        function addMessage(text, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            messageDiv.textContent = text;
            
            messagesDiv.insertBefore(messageDiv, typing);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showTyping() {
            typing.classList.add('active');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function hideTyping() {
            typing.classList.remove('active');
        }

        function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, true);
            userInput.value = '';

            showTyping();

            // Simula delay de resposta (aqui você pode conectar com uma API real)
            setTimeout(() => {
                hideTyping();
                const response = getBotResponse(message);
                addMessage(response, false);
            }, 1000 + Math.random() * 1000);
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
